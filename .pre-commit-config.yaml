repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
     - id: ruff
       name: Ruff Linter
       args: ["--fix"]
       language: system
     - id: ruff-format
       name: Ruff Formatter
       language: system
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 'v2.3.0'
    hooks:
      - id: mypy 
        name: Mypy Linter
        language: system
  - repo: local
    hooks:
    - id: pytest
      name: pytest
      entry: uv run pytest
      language: system
      pass_filenames: false