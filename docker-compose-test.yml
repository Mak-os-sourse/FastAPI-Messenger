services:
  db:
    image: postgres:alpine

    environment:
      POSTGRES_PASSWORD: 1234567
      POSTGRES_USER: root
      POSTGRES_DB: db
      PGDATA: /var/lib/postgresql/data/pgdata

    ports:
      - "5434:5432"

    tmpfs:
      - /var/lib/postgresql/data/pgdata
    
  redis:
    image: redis:alpine

    ports:
      - "6378:6379"

    tmpfs:
      - /data

  s3:
    image: rustfs/rustfs:latest
    user: root
    ports:
      - "8000:9000"
      - "8001:9001"
    tmpfs:
      - /data
    environment:
      RUSTFS_ACCESS_KEY: root
      RUSTFS_SECRET_KEY: 12345678
